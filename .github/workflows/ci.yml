name: validator-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python -m build
      - run: python -m twine check dist/*
      - run: everyframe-validator --version
      - name: Check wheel outside source tree
        run: |
          python -m venv /tmp/everyframe-validator-wheel
          /tmp/everyframe-validator-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/everyframe-validator-wheel/bin/everyframe-validator --help
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and smoke-test without networking
        run: |
          docker build -t validator-ci .
          docker run --rm --network none validator-ci --version
          docker run --rm --network none validator-ci --help
          docker run --rm --network none --entrypoint python validator-ci -c 'from everyframe_validator.healthcheck import container_started_at; import time; assert 0 <= time.time() - container_started_at() < 60'
      - name: Validate managed Compose configuration
        env:
          VALIDATOR_IMAGE: ghcr.io/everyframe-studios/everyframe-validator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose --file deploy/compose.yaml config --quiet
