services:
  validator:
    image: ${VALIDATOR_IMAGE:-ghcr.io/everyframe-studio/everyframe-validator:latest}
    pull_policy: ${VALIDATOR_PULL_POLICY:-always}
    command: ["run", "--state-dir", "/state"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777,size=256m
    environment:
      BITTENSOR_RUNTIME_CACHE_DIR: /state/runtime-cache
      EVERYFRAME_RPC_URL: ${EVERYFRAME_RPC_URL:-}
      EVERYFRAME_RPC_API_KEY: ${EVERYFRAME_RPC_API_KEY:-}
    volumes:
      - validator-state:/state
    healthcheck:
      test: ["CMD", "python", "-m", "everyframe_validator.healthcheck", "/state"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s
    stop_grace_period: 310s
    # To sign, explicitly add --submit above after local authorization,
    # and mount only the intended wallet read-only (see README).
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  validator-state:
